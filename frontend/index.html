
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1c1c1c" />
    <title>ЭЧ</title>

    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon_dark.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />

    <script>
      (function () {
        try {
          var base = '%BASE_URL%';
          var theme = localStorage.getItem('ech-board-theme') === 'light' ? 'light' : 'dark';
          var style = localStorage.getItem('ech-board-ui-style');

          if (style === 'vista') theme = 'light';

          document.documentElement.setAttribute('data-theme', theme);

          if (style === 'vista' || style === 'potato') {
            document.documentElement.setAttribute('data-ui-style', style);
          }

          var icon = document.querySelector('link[rel="icon"]');
          if (icon) {
            icon.href = base + (theme === 'dark' ? 'favicon_dark.png' : 'favicon_light.png');
          }

          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.content = style === 'vista' ? '#2a364d' : theme === 'dark' ? '#1c1c1c' : '#EEE';
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="%BASE_URL%src/main.tsx"></script>
  </body>
</html>
